name: lint

# push ごとに rawpaco の静的解析を激辛モード（--fail-on=warning）で走らせる。
# pull_request でも走らせるのは、--format=github の注釈が PR の差分行に
# インラインで付くのがレビュー時に最も効くため。
on:
  push:
  pull_request:

jobs:
  rawpaco:
    name: rawpaco (激辛モード)
    runs-on: ubuntu-latest
    # どこかで止まっても 6 時間待たされないように（GLES2 の検査が CI で 4 時間半
    # 止まったことがある）。
    timeout-minutes: 60
    steps:
      - name: Checkout papimela
        uses: actions/checkout@v7

      # rawpaco は公開リポジトリなのでトークン不要。
      #
      # ref を main に固定しているのは、rawpaco 側でルールが増えたら
      # papimela にも即座に効かせたいため。逆に「rawpaco の更新で突然 CI が
      # 赤くなる」のを避けたい場合は、ref をコミット SHA に差し替える。
      - name: Checkout rawpaco
        uses: actions/checkout@v7
        with:
          repository: tankoha/rawpaco
          ref: main
          path: .rawpaco

      # rawpaco は tree-sitter を vendoring 済みなので fpc と gcc だけでよい。
      # gcc は ubuntu-latest に同梱。
      - name: Install FPC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fpc
          # GPU のドライバ（GLES2）の検査に、Mesa のソフトウェア実装（llvmpipe）と
          # 窓の無い EGL（surfaceless）を使う。
          sudo apt-get install -y libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri libwayland-client0

      - name: Build rawpaco
        working-directory: .rawpaco
        run: make

      # 静的解析の前にコンパイルが通ることを確かめる。lint だけ通って
      # ビルドが壊れている状態を見逃さないための保険。
      # 不要なら、このステップは削除してよい。
      #
      # アンブレラの PaPiMeLa は依存を辿って手書きユニットと全バックエンドを巻き込む
      # （PaPiMeLa.Core だけでは、もうバックエンドを巻き込まない。#45）。
      # 生成プロトコルは実際に使われているものしか通らないので、残りも個別に
      # コンパイルして、生成器の退行を検出できるようにする。
      - name: Build papimela
        run: |
          set -eu
          mkdir -p lib
          fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib src/PaPiMeLa.pas
          fpc -O1 -FUlib tools/wlscan-pas.pas
          for f in src/generated/*.pas; do
            fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib "$f"
          done
          # GL の検査は GPU が要るので CI では走らせないが、コンパイルだけは通す
          # （EGL / GLES2 のユニットを壊していないことの確認）。
          fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib -otest/test_gl_window test/test_gl_window.pas

      # Babashka は checkorigin と qwen-gen が使う。単一バイナリなので導入は速い。
      - name: Install Babashka
        run: |
          curl -sSL https://raw.githubusercontent.com/babashka/babashka/master/install \
            | sudo bash

      # アンブレラ（PaPiMeLa）の並べ直しは公開層から生成する。公開 API を足して
      # 生成し直し忘れたら落ちる。
      - name: Check umbrella is up to date
        run: ./tools/genumbrella.bb --check

      # Origin 行と設計書 第11章の由来列の突き合わせ。移植部分に SDL の著作権表示が
      # あるか、クリーンルーム部分に紛れ込んでいないかもここで見る。
      - name: Check origins
        run: ./tools/checkorigin.bb

      # 表示サーバの要らないテスト。CI には Wayland セッションが無いので、
      # ダミーバックエンドで動く公開 API の検証だけをここで回す。
      # 実機のコンポジタが要るテスト（T-04/T-05/T-08/T-10）はローカル専用。
      - name: Run headless tests
        env:
          # ランナーには RealtimeKit が無いので、優先度を上げる検査だけ飛ばしてよい（test_threading）
          PAPIMELA_RTKIT_OPTIONAL: "1"
        run: |
          set -eu
          for t in test_dummy_video test_pixels test_io test_surface test_blit test_render test_render_window test_render_logical test_time test_keyboard test_textinput_v3 test_ime_keys test_ibus_model test_clipboard test_protocol_types test_threading test_backends test_umbrella; do
            fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib -otest/$t test/$t.pas
            ./test/$t
          done

      # サンプル。ビルドが通ることと、表示サーバ無しの自己検査（コンピュータ同士の
      # 対戦を再生して盤面と描画を見る）が通ることを確かめる。
      - name: IBus with ibus-mozc (end to end)
        timeout-minutes: 10
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends ibus ibus-mozc dbus-daemon
          fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib -otest/test_ibus_textinput test/test_ibus_textinput.pas
          # ランナーは使い捨ての VM で root でもないので、隔離せずに ibus-session で立てる
          sh tools/ibus-sandbox/ibus-session ./test/test_ibus_textinput

      - name: Build and self-test examples
        run: |
          set -eu
          fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib -oexamples/pong examples/pong.pas
          ./examples/pong --selftest

      # GPU のドライバをソフトウェアのドライバと画素で比べる。CI に GPU は無いので
      # Mesa の llvmpipe で描く。ウィンドウの区間は Wayland が無いので飛ばされる。
      - name: Compare the GLES2 render driver with the software one (llvmpipe)
        timeout-minutes: 5
        run: |
          set -eu
          fpc -O1 -Fisrc -Fusrc -Fusrc/generated -FUlib -otest/test_render_gles2 test/test_render_gles2.pas
          LIBGL_ALWAYS_SOFTWARE=1 ./test/test_render_gles2

      # 図と実装の乖離検査。英日の Mermaid ブロックの同一性と、図に出てくる型が
      # 実装に存在することを確認する。速いので lint より先に置く。
      - name: Check diagrams
        run: ./tools/check-diagrams.sh

      # --fail-on=warning が激辛モード。診断が 1 件でもあれば終了コード 1。
      # --format=github で GitHub Actions のワークフローコマンド形式にし、
      # 該当行へインライン注釈を付ける。
      #
      # src/generated/ も対象に含めている。生成コードが指摘を受けたら、それは
      # 生成器 tools/wlscan-pas の不具合なので、むしろ検出したい。
      - name: Run rawpaco (--fail-on=warning)
        run: |
          .rawpaco/src/rawpaco \
            --fail-on=warning \
            --format=github \
            src/*.pas \
            src/generated/*.pas \
            test/*.pas \
            spikes/*.pas \
            tools/*.pas \
            examples/*.pas
